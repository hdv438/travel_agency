<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Tracking API Documentation</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5/favicon-16x16.png" sizes="16x16" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fdfdfd;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar {
      background-color: #1a1a24 !important;
      padding: 10px 0;
    }
    .swagger-ui .info {
      margin: 30px 0;
    }
    .swagger-ui .info .title {
      font-size: 32px;
      color: #1e293b;
    }
    .swagger-ui .scheme-container {
      background: #f8fafc;
      box-shadow: none;
      border-bottom: 1px solid #e2e8f0;
      padding: 15px 0;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  {% raw %}
  <script>
    window.onload = function() {
      // First attempt: static asset route /assets/agency_tracking/swagger.json
      // If deployed without built assets, fallback to /api/method/agency_tracking.api_docs.get_swagger_spec
      fetch('/assets/agency_tracking/swagger.json')
        .then(function(res) {
          if (res.ok) {
            return res.json();
          }
          return fetch('/api/method/agency_tracking.api_docs.get_swagger_spec')
            .then(function(apiRes) { return apiRes.json(); })
            .then(function(data) { return data.message || data; });
        })
        .then(function(spec) {
          const ui = SwaggerUIBundle({
            spec: spec,
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
              SwaggerUIBundle.presets.apis,
              SwaggerUIStandalonePreset
            ],
            plugins: [
              SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: "StandaloneLayout",
            requestInterceptor: function(req) {
              // Automatically include session cookies for testing authenticated endpoints
              req.credentials = 'include';
              return req;
            }
          });
          window.ui = ui;
        })
        .catch(function(err) {
          console.error("Error loading Swagger spec:", err);
          document.getElementById('swagger-ui').innerHTML = 
            '<div style="padding: 40px; text-align: center; color: #e11d48;">' +
            '<h2>Failed to load API Documentation spec</h2>' +
            '<p>' + err.message + '</p>' +
            '</div>';
        });
    };
  </script>
  {% endraw %}
</body>
</html>
