  /api/method/agency_tracking.applicant_api.restart_applicant:
    post:
      tags:
      - 02 - Applicants & Registration
      summary: Restart Applicant
      description: 'Cancelled -> Draft or Registered. cycle_number bumps automatically
        (lands on

        Draft/Registered coming from Cancelled -- state_machine.bump_cycle_number).
        Restarting

        straight to Registered fails naturally via the normal ValidationError from

        Applicant.validate() if the field floor isn''t actually satisfied by existing
        data --

        retry with target_status="Draft" instead, no special-casing needed here.


        **Authorized Roles:** Manager, System Manager, Registrar, Administrator, Admin'
      operationId: restart_applicant
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicant_name:
                  type: string
                  description: 'Parameter: applicant_name'
                target_status:
                  type: string
                  description: 'Parameter: target_status'
              required:
              - applicant_name
              - target_status
            example:
              applicant_name: '{{applicant_name}}'
              target_status: test_value
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Permission Denied / Insufficient Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/method/agency_tracking.applicant_api.set_country_ban:
    post:
      tags:
      - 02 - Applicants & Registration
      summary: Set Country Ban
      description: 'Whitelisted create surface for Applicant Country Ban (backend-issues
        #08) -- the doctype

        previously had no whitelisted writer anywhere, so the only way to set a ban
        was the raw

        /api/resource/Applicant Country Ban endpoint, contradicting the "no raw /api/resource/*

        exposure" architecture rule. Doctype permissions already grant create to Registrar/

        Complaint Manager/Manager/Admin/System Manager, so this just wraps a normal
        insert() and

        lets Frappe''s own permission check do the gating.


        **Authorized Roles:** Manager, System Manager, Registrar, Administrator, Admin'
      operationId: set_country_ban
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicant_name:
                  type: string
                  description: 'Parameter: applicant_name'
                country:
                  type: string
                  description: 'Parameter: country'
                reason:
                  type: string
                  description: 'Parameter: reason'
              required:
              - applicant_name
              - country
              - reason
            example:
              applicant_name: '{{applicant_name}}'
              country: test_value
              reason: Verified operational processing.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Permission Denied / Insufficient Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/method/agency_tracking.applicant_api.update_applicant:
    post:
      tags:
      - 02 - Applicants & Registration
      summary: Update Applicant
      description: "Edit an Applicant still at Draft or Registered. Does not change\
        \ status — use\nregister_applicant for that transition.\n\nTwo special cases\
        \ handled here rather than in Applicant.validate() (both need to run\n*before*\
        \ the normal update, and the entry_track one needs its own transition() call\
        \ --\nsee CLAUDE.md's absolute \"no doc.status = X; doc.save()\" rule, state_machine.py):\n\
        \n1. entry_track changing while Registered/CV Generated forces a regression\
        \ to Draft first\n   (old track still in place, so the lenient Draft floor\
        \ trivially passes), *then* the rest\n   of the update (including the new\
        \ entry_track) applies normally. cycle_number bumps\n   automatically via\
        \ state_machine.bump_cycle_number.\n2. destination_country being set/changed\
        \ is checked against Applicant Country Ban.\n\n**Authorized Roles:** Kuwait\
        \ Embassy, Manager, Kuwait Telesign, Ticketer, Finance Manager, Saudi LMIS,\
        \ Saudi Taeshir, Kuwait LMIS, Contract Parser, System Manager, Administrator,\
        \ Clearance Officer, Saudi Embassy, Registrar, Communication Manager, Admin,\
        \ Complaint Manager"
      operationId: update_applicant
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicant_name:
                  type: string
                  description: 'Parameter: applicant_name'
                override_ban:
                  type: string
                  description: 'Parameter: override_ban'
                override_reason:
                  type: string
                  description: 'Parameter: override_reason'
                data:
                  type: string
                  description: 'Parameter: data'
              required:
              - applicant_name
              - data
            example:
              applicant_name: '{{applicant_name}}'
              override_ban: test_value
              override_reason: Management authorization granted.
              data: test_value
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Permission Denied / Insufficient Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/method/agency_tracking.applicant_api.update_applicant_for_lmis:
    post:
      tags:
      - 02 - Applicants & Registration
      summary: Update Applicant For Lmis
      description: 'Narrow LMIS-stage edit surface (2026-08-29 correction, Part 5):
        national_id, labor_id,

        and emergency_contact_* are deliberately NOT part of the Registered field
        floor -- they''re

        captured here, once the candidate is actually at the LMIS clearance step,
        not guessed at

        registration time. Restricted to the two LMIS roles (plus Manager/Admin, same
        fallback

