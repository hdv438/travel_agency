openapi: 3.1.0
info:
  title: Agency Tracking Production API
  description: Production-grade, 100% verified OpenAPI 3.1.0 specification for the
    Agency Tracking recruitment and foreign placement platform running on Frappe.
  version: 2.0.0
  contact:
    name: API Operations Team
    email: api-support@example.local
servers:
- url: http://127.0.0.1:8000
  description: Local Development Server
tags:
- name: 01 - Authentication & Session
  description: Login, session status, and CSRF token bootstrap
- name: 02 - Applicants & Registration
  description: Candidate onboarding, biometric registration, passport MRZ OCR parsing,
    country bans
- name: 03 - CV Management
  description: CV generation, letterhead rendering, PDF download streaming
- name: 04 - Portal & Candidate Discovery
  description: Foreign agency candidate search, filtering, and candidate selection
- name: 05 - Placements & Logistics
  description: Contract parsing, Kuwait visa parsing, medical checkpoints, flight
    ticketing, departures
- name: 06 - Clearances & Embassies
  description: Corridor clearance steps (LMIS, Taeshir, Telesign), embassy submission,
    stamping, rejection
- name: 07 - Finance & Ledger
  description: Stage expenses/income, FX exchange rates, commission batch requests,
    invoices, settlement
- name: 08 - Bank Reconciliation
  description: Bank statement CSV upload, automated line matching, manual override
    reconciliation
- name: 09 - Complaints & Disputes
  description: Agency dispute logging, triage acknowledgement, resolution, free replacement
    requests
- name: 10 - Chat & Messages
  description: Real-time communication channels, agency-to-staff threads, direct messaging,
    attachments
- name: 11 - Notifications
  description: User notification inbox, watchdog alert streaming, mark as read
- name: 12 - Contractors & Foreign Agencies
  description: Foreign agency contractor accounts, quota tracking, agency listing
- name: 13 - Reports & Analytics
  description: Executive operations summary, recruitment funnel, aging reports, Excel
    commission export
- name: 14 - API Documentation
  description: OpenAPI / Swagger live schema discovery
- name: 15 - Core RPC & File Storage
  description: Frappe core file upload, attachment management, and downloads
paths:
  /api/method/agency_tracking.auth_api.get_csrf_token:
    post:
      tags:
      - 01 - Authentication & Session
      summary: Get Csrf Token
      description: 'get_csrf_token


