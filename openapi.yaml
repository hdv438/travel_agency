  /api/method/agency_tracking.applicant_api.log_applicant_fee:
    post:
      tags:
      - 02 - Applicants & Registration
      summary: Log Applicant Fee
      description: 'Manual ''Log Fee'' button path. Just flips fee_status to Paid
        and saves -- the actual

        ledger-entry creation lives in Applicant.maybe_log_fee_transaction (before_save),
        so a

        direct Desk edit that sets fee_status=Paid gets identical behavior without
        going through

        this endpoint at all. Kept as its own whitelisted call (rather than folding
        into

        update_applicant) so the button can carry its own explicit permission + friendly

        already-logged error, matching the other single-purpose action endpoints in
        this module.


        **Authorized Roles:** Kuwait Embassy, Manager, Kuwait Telesign, Ticketer,
        Finance Manager, Saudi LMIS, Saudi Taeshir, Kuwait LMIS, Contract Parser,
        System Manager, Administrator, Clearance Officer, Saudi Embassy, Registrar,
        Communication Manager, Admin, Complaint Manager'
