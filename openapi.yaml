      tags:
      - 02 - Applicants & Registration
      summary: Register Applicant
      description: 'Move an Applicant from Draft to Registered via the sanctioned
        transition() path

        (Part A.2 Stage 2). Field-floor and medical-FIT checks run inside Applicant.validate(),

        triggered by transition()''s doc.save().


        **Authorized Roles:** Kuwait Embassy, Manager, Kuwait Telesign, Ticketer,
        Finance Manager, Saudi LMIS, Saudi Taeshir, Kuwait LMIS, Contract Parser,
        System Manager, Administrator, Clearance Officer, Saudi Embassy, Registrar,
        Communication Manager, Admin, Complaint Manager'
      operationId: register_applicant
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
