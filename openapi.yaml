        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Permission Denied / Insufficient Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/method/agency_tracking.applicant_api.cancel_applicant:
    post:
      tags:
      - 02 - Applicants & Registration
      summary: Cancel Applicant
      description: 'Global ''Cancelled'' escape hatch (2026-08-29 lifecycle spec):
        only from Registered/CV

        Generated (never Draft -- nothing committed yet to cancel). If there''s an
        active Placement,

        freeze it and its Clearance Steps first (marked Cancelled, left as permanent
        history) and

        clear active_placement -- all before the Applicant itself moves to Cancelled,
        so

        Placement.validate()''s own checks (still-matching active_placement/status)
        pass cleanly.

        Landing on Cancelled never bumps cycle_number by itself; only a later restart
        does.


        **Authorized Roles:** Manager, System Manager, Registrar, Administrator, Admin'
      operationId: cancel_applicant
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicant_name:
                  type: string
                  description: 'Parameter: applicant_name'
                reason:
                  type: string
                  description: 'Parameter: reason'
              required:
              - applicant_name
              - reason
            example:
              applicant_name: '{{applicant_name}}'
              reason: Verified operational processing.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Permission Denied / Insufficient Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
