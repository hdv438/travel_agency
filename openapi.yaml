  /api/method/agency_tracking.applicant_api.remove_country_ban:
    post:
      tags:
      - 02 - Applicants & Registration
      summary: Remove Country Ban
      description: 'Delete permission on Applicant Country Ban is Manager/Admin/System
        Manager only (per

        doctype permissions) -- Registrar/Complaint Manager can set a ban but not
        lift one.


        **Authorized Roles:** Manager, System Manager, Registrar, Administrator, Admin'
      operationId: remove_country_ban
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
