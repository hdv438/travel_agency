        Saudi Taeshir, System Manager, Clearance Officer, Saudi Embassy, Registrar,
        Complaint Manager, Ticketer, Finance Manager, Kuwait LMIS, Contract Parser,
        Guest, Administrator, Communication Manager, Admin, Foreign Agency'
      operationId: get_csrf_token
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
            example: {}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Permission Denied / Insufficient Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/method/agency_tracking.auth_api.get_current_user:
    post:
      tags:
      - 01 - Authentication & Session
      summary: Get Current User
      description: 'allow_guest=True deliberately, with an explicit Guest check inside
        — not a security

        relaxation. Without it, an anonymous SPA''s "is there already a session?"
        bootstrap check

        (needed so a page refresh doesn''t force a fresh login) hits Frappe''s own
        whitelist guard

        before this function''s body ever runs, producing a 403 on every single cold
        page load.

        Returning None for Guest instead of throwing means that bootstrap check is
        a normal 200

        response either way — "nobody''s logged in" is an expected outcome, not an
        error.


        Response includes user, full_name, roles, plus contractor (the linked Contractor
        name for Foreign Agency users, null for internal staff / unlinked users) and
        is_internal_staff — server-derived tenant context so the SPA never has to infer
        its own Contractor from an unrelated operation.


        **Authorized Roles:** Kuwait Embassy, Manager, Kuwait Telesign, Ticketer,
        Finance Manager, Saudi LMIS, Saudi Taeshir, Kuwait LMIS, Contract Parser,
        Guest, System Manager, Administrator, Clearance Officer, Saudi Embassy, Registrar,
        Communication Manager, Admin, Complaint Manager, Foreign Agency'
      operationId: get_current_user
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
            example: {}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Permission Denied / Insufficient Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/method/agency_tracking.auth_api.get_assignable_roles:
    post:
      tags:
      - 01 - Authentication & Session
      summary: Get Assignable Roles
      description: 'The roles this app actually uses (install.ROLES), for populating a role-assignment picker -- not Frappe''s ~30 generic built-ins. Filtered to roles that actually exist as Role docs, so the list reflects reality on a fresh site. Restricted to management, since assigning roles is an admin action.


**Authorized Roles:** Manager, Admin, Finance Manager, System Manager, Administrator'
      operationId: get_assignable_roles
      security:
      - frappeSessionCookie: []
        frappeCsrfToken: []
      - frappeApiToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
